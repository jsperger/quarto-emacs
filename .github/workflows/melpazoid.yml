# CI checks: byte-compilation, checkdoc, ERT tests, and melpazoid.

name: CI
on: [push, pull_request]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        emacs_version: ['29.4', '30.1', 'snapshot']
    steps:
    - uses: actions/checkout@v4
    - uses: purcell/setup-emacs@master
      with:
        version: ${{ matrix.emacs_version }}
    - name: Install dependencies
      run: |
        emacs --batch --eval '
          (progn
            (require (quote package))
            (add-to-list (quote package-archives) (quote ("melpa" . "https://melpa.org/packages/")) t)
            (package-initialize)
            (package-refresh-contents)
            (dolist (pkg (quote (polymode poly-markdown markdown-mode request)))
              (unless (package-installed-p pkg)
                (package-install pkg))))'
    - name: Byte-compile (strict)
      run: |
        emacs --batch \
          --eval '(progn (require (quote package)) (package-initialize) (setq byte-compile-error-on-warn t))' \
          -L . -f batch-byte-compile quarto-mode.el
        rm -f quarto-mode.elc
    - name: Checkdoc
      run: |
        emacs --batch --eval '
          (progn
            (require (quote checkdoc))
            (with-current-buffer (find-file-noselect "quarto-mode.el")
              (if (fboundp (quote checkdoc-batch))
                  (checkdoc-batch)
                (checkdoc-current-buffer t))))'
    - name: Run ERT tests
      run: |
        emacs --batch \
          --eval '(progn (require (quote package)) (package-initialize))' \
          -L . -L test -l quarto-mode-test -f ert-run-tests-batch-and-exit

  melpazoid:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - uses: actions/setup-python@v5
      with:
        python-version: '3.12'
    - uses: purcell/setup-emacs@master
      with:
        version: '30.1'
    - name: Install melpazoid
      run: |
        python -m pip install --upgrade pip
        git clone https://github.com/riscy/melpazoid.git ~/melpazoid
        pip install ~/melpazoid
    - name: Run melpazoid
      env:
        LOCAL_REPO: ${{ github.workspace }}
        RECIPE: (quarto-mode :repo "quarto-dev/quarto-emacs" :fetcher github)
        EXIST_OK: false
      run: make -C ~/melpazoid
